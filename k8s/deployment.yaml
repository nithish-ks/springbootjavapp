apiVersion: apps/v1
kind: Deployment
metadata:
  name: petclinic

spec:
  replicas: 1

  selector:
    matchLabels:
      app: petclinic

  template:
    metadata:
      labels:
        app: petclinic

    spec:
      containers:
        - name: petclinic
          image: acrnithish090826.azurecr.io/springbootjavaapp:latest
          imagePullPolicy: Always

          ports:
            - containerPort: 8080 